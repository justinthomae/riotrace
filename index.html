<style>
  html { min-height: 100%; background: #0a080a url('rr-keyart-wide.webp') center / cover no-repeat fixed; }
  body { background: transparent !important; }
  @media (orientation: portrait) { html { background-image: url('rr-keyart-tall.webp'); } }
  /* The key art carries the logo, so Unity's own loading logo is hidden rather than replaced. */
  #unity-logo { display: none !important; }
  /* Riot Race loader: the key art shows through the canvas until the game draws its first frame. */
  #unity-container, #unity-canvas { background: transparent !important; }
  #unity-loading-bar { top: auto !important; bottom: 7vh !important; transform: translateX(-50%) !important;
    width: min(560px, 84vw); padding: 14px 20px 16px; border-radius: 18px; box-sizing: border-box;
    background: rgba(10, 8, 10, 0.62); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45); text-align: center;
    font: 800 15px/1.3 "Trebuchet MS", system-ui, sans-serif; color: #fff; letter-spacing: 0.04em; }
  #rr-load-title { display: flex; justify-content: space-between; font-size: 18px; text-shadow: 0 2px 0 #000; }
  #rr-load-title b { color: #ffb03a; }
  #unity-progress-bar-empty { width: 100% !important; height: 22px !important; margin: 10px 0 0 !important; float: none !important;
    background: #1b1620 !important; border: 3px solid #fff; border-radius: 14px; overflow: hidden; box-sizing: border-box; }
  #unity-progress-bar-full { height: 100% !important; margin: 0 !important; float: none !important; border-radius: 10px; transition: width 0.25s;
    background: repeating-linear-gradient(-45deg, #ff7a12 0 14px, #ffb03a 14px 28px) !important;
    background-size: 40px 40px !important; animation: rr-stripes 0.8s linear infinite; }
  @keyframes rr-stripes { to { background-position: 40px 0; } }
  /* Top-left, in the key art's sky (owner); outside the loading bar so it is placed against the screen. */
  #rr-load-logo { position: fixed; top: max(16px, 3vh); left: max(16px, 2.5vw); width: min(440px, 46vw); z-index: 2;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5)); pointer-events: none; }
  /* Portrait: centred on the screen, over the karts (owner). */
  @media (orientation: portrait) { #rr-load-logo { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(520px, 88vw); } }
  #rr-load-tip { margin-top: 10px; font-weight: 600; font-size: 14px; color: #e8e2f4; min-height: 1.3em; }
</style>

        </div><div id="rr-load-tip"></div>
<script>
  (function () {
    var tips = ["Drift through corners to fill your turbo.", "Tap BOOST right at GO for a perfect start.",
      "Drift-dodge a missile lock to break it.", "Grab wrenches to repair, cartridges for ammo.",
      "Secret routes hide off the racing line.", "Wreck your grudge rival to settle the score."];
    var i = Math.floor(Math.random() * tips.length), el = document.getElementById("rr-load-tip");
    function next() { el.textContent = tips[i++ % tips.length]; }
    next(); setInterval(next, 3500);
    // The logo lives outside the loading bar; it goes when the bar does (the game shows its own).
    var logo = document.getElementById("rr-load-logo"), bar = document.getElementById("unity-loading-bar");
    var watch = setInterval(function () {
      if (bar && bar.style.display === "none") { logo.style.display = "none"; clearInterval(watch); }
    }, 250);
  })();
</script>

    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/41cdab0c5d0f749fb770d5e506cf23d2.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/464305bdc4579af3b6d930fd0bacd5fe.data.unityweb",
        frameworkUrl: buildUrl + "/7b44401349a5ae375f0112cf90fa51f2.framework.js.unityweb",
        codeUrl: buildUrl + "/9da639f75d5ac9975b0ba45e8da28b40.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Grudge Match Games",
        productName: "Riot Race",
        productVersion: "9f9f7b8",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%"; document.getElementById("rr-load-pct").textContent = Math.round(100 * progress) + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  
<script>
  if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
    var rrReloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (rrReloaded) return;
      rrReloaded = true;
      window.location.reload();
    });
  }
