<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Riot Race</title>
<meta name="description" content="Riot Race: 3D combat racing by Grudge Match Games. Drift, boost, lock on and wreck your rivals. Coming soon.">
<meta name="theme-color" content="#0a080a">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Riot Race">
<meta property="og:description" content="3D combat racing by Grudge Match Games. Coming soon.">
<meta property="og:image" content="https://riotrace.grudgematchgames.com/og-image.jpg">
<meta property="og:url" content="https://riotrace.grudgematchgames.com/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg: #0a080a; --fg: #f4f1ee; --muted: #c9c2bc; --accent: #ff7a1a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
         background: var(--bg) url('rr-keyart-wide.webp') center / cover no-repeat fixed;
         display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
         padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  @media (orientation: portrait) { body { background-image: url('rr-keyart-tall.webp'); } }
  body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(180deg, rgba(10,8,10,0) 45%, rgba(10,8,10,.92) 85%); }
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  main { position: relative; padding-bottom: 4vh; }
  p { margin: .4em auto; color: var(--muted); max-width: 34em; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .soon { color: var(--fg); font-weight: 800; letter-spacing: .2em; text-transform: uppercase; margin-top: 1em;
          display: inline-block; padding: .6em 1.4em; border: 2px solid var(--accent); background: rgba(10,8,10,.6); }
  footer { margin-top: 2em; font-size: 13px; color: var(--muted); text-shadow: 0 2px 8px rgba(0,0,0,.8); }
</style>
</head>
<body>
<main>
  <h1>Riot Race</h1>
  <p>3D combat racing for up to eight racers. Drift, boost, lock on, and leave your rivals in the wall.</p>
  <p class="soon">Coming soon</p>
  <footer>© 2026 Grudge Match Games</footer>
</main>
</body>
</html>
